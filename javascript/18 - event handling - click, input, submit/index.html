<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <h1>DOM Manipulation</h1>

    <!-- click event -->
    <button type="button" id="clickBtn">Click Me</button>

    <!-- input event   -->
    <input type="text" id="nameInput" placeholder="enter your name" />
    <p id="liveText"></p>

    <br />

    <!-- submit event -->
    <form action="#" id="myForm">
        <input type="text" id="email" placeholder="enter email" />
        <button type="submit">Submit</button>
    </form>
    <p id="formOutput"></p>

    <script>
        // 1. click event
        document.getElementById("clickBtn").addEventListener("click", function () {
            alert("Button Clicked!");
        });

        // 2. input event 
        document.getElementById("nameInput").addEventListener("input", function (event) {
            let value = event.target.value;
            document.getElementById("liveText").innerText = "Typing... " + value;
        });

        // 3. submit event
        document.getElementById("myForm").addEventListener("submit", function (event) {
            event.preventDefault();

            let email = document.getElementById("email").value;

            if (email === "") {
                alert("please enter email");
                return;
            }

            document.getElementById("formOutput").innerText = "Submitted Email: " + email;
        });
    </script>
</body>

</html>
