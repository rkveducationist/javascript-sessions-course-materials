<body>
    <h1>ECMA Script</h1>

    
    <script>
        let fruits = ["Apple", "Banana", "Mango"];

        let firstFruit = fruits[0];
        
        // destructuring
        let [first, second] = fruits;

        document.write("first: " + first);

        let student = {
            name: "sri", 
            age: 25, 
            city: "delhi"
        };

        let {name, age} = student;

        document.write("age: " + age);
        

    </script>
